<body>



  <div class="auth-page">
    <aside class="auth-aside">
      <img src="../assets/images/properties/p1.svg" alt="" onerror="this.remove()">
      <div class="doc-brand text-white"><span class="d-inline-grid" style="width: 40px; height: 40px; background: rgba(255,255,255,.18); border-radius: 10px; place-items: center;"><i class="bi bi-buildings"></i></span>EstatePro</div>
      <div><h2>Extra protection for your portfolio.</h2><p class="opacity-75 mb-4">A second step stops anyone else from using your account.</p></div>
      <div class="small opacity-75">&copy; 2026 EstatePro. All rights reserved.</div>
    </aside>
    <main class="auth-main"><div class="auth-card">
      <div class="mb-4 d-lg-none"><a href="../index.html" class="doc-brand text-decoration-none" style="color: inherit;"><span class="sidebar-brand-icon d-inline-grid" style="width: 40px; height: 40px; background: var(--primary-color); color: #fff; border-radius: 10px; place-items: center;"><i class="bi bi-buildings"></i></span>EstatePro</a></div>
      <div class="text-center">
        <div class="err-icon"><i class="bi bi-shield-lock"></i></div>
        <h1 class="h3 mb-2">Two-factor authentication</h1>
        <p class="text-secondary mb-4">Enter the 6 digit code from your authenticator app.</p>
      </div>
      <form id="otpForm" data-redirect="../index.html">
        <div class="otp-row mb-4"><input type="text" class="form-control otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="one-time-code"><input type="text" class="form-control otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 2" autocomplete="one-time-code"><input type="text" class="form-control otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 3" autocomplete="one-time-code"><input type="text" class="form-control otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 4" autocomplete="one-time-code"><input type="text" class="form-control otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 5" autocomplete="one-time-code"><input type="text" class="form-control otp-input" inputmode="numeric" maxlength="1" aria-label="Digit 6" autocomplete="one-time-code"></div>
        <button type="submit" class="btn btn-primary w-100">Verify and sign in</button>
      </form>
      <div class="d-flex justify-content-between mt-3 small">
        <button type="button" class="btn btn-link btn-sm p-0" data-toast="A new code was sent." data-toast-type="success">Resend code</button>
        <button type="button" class="btn btn-link btn-sm p-0" data-toast="Backup codes are in Settings, Security." data-toast-type="info">Use a backup code</button>
      </div>
      <p class="text-center mt-4 mb-0"><a href="login.html" class="fw-semibold"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a></p>
    </div></main>
